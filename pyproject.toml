[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelx-cloud-core"
version = "0.11.0"
description = "SentinelX agent: connects a Linux server to sentinelx-cloud-hub via WebSocket"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Pensados" }]

dependencies = [
    "websockets>=12.0",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "sentinelx-cloud-protocol @ git+https://github.com/pensados/sentinelx-cloud-protocol.git@v1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
sentinelx-cloud-core = "sentinelx_core.__main__:main"
sentinelx-pensa-safe-edit = "sentinelx_core.vendored.pensa_safe_edit:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelx_core"]

[tool.hatch.metadata]
# We pin sentinelx-cloud-protocol to a git tag during dev. Once it's on PyPI
# we can drop this flag and use a regular version constraint.
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
