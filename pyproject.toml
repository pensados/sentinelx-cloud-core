[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelx-cloud-core"
version = "0.23.51"
description = "SentinelX agent: connects a Linux server to sentinelx-cloud-hub via WebSocket"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Pensados" }]

dependencies = [
    "websockets>=12.0",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    # v1.12.0 is where RequestMessage gained opaque_ref. Executor advertises
    # that capability, and RequestMessage is extra="forbid", so a clean
    # install against v1.11.0 promised a field it would then reject the whole
    # message for carrying. Reported by FalconZip with the commit pair.
    "sentinelx-cloud-protocol @ git+https://github.com/pensados/sentinelx-cloud-protocol.git@v1.13.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.17.1",
]

[project.scripts]
sentinelx-cloud-core = "sentinelx_core.__main__:main"
sentinelx-pensa-safe-edit = "sentinelx_core.vendored.pensa_safe_edit:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelx_core"]

[tool.hatch.metadata]
# We pin sentinelx-cloud-protocol to a git tag during dev. Once it's on PyPI
# we can drop this flag and use a regular version constraint.
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A pinned rule set that catches bugs, not style. With no `select`, each Ruff release
# brought its own defaults: 5 diagnostics on 0.4, 152 on 0.17 (Jan's audit, 2026-10-31).
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "PLE"]
ignore = [
    "ASYNC109",  # `timeout` parameters are this API's contract, not trio-style cancel scopes
    "ASYNC240",  # a stat()/exists() on a local path inside a handler isn't worth a thread hop
    "B904",      # `raise ... from`: changes how tracebacks chain, not behaviour
]

[tool.ruff.lint.per-file-ignores]
# Tests block on purpose (sleeps, subprocesses), and use one-line setups.
"tests/**" = ["ASYNC", "E402", "E702", "E731", "B017", "B905"]
