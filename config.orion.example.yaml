    description: "BookStack + pensa-docs"
  var:
    path: "/var"
    description: "Datos variables del sistema: logs, cache, lib, www"
  var_log:
    path: "/var/log"
    description: "Logs del sistema y servicios"
  var_www:
    path: "/var/www"
    description: "Roots web y sitios desplegados"
  web_roots:
    path: "/var/www"
    description: "Sitios publicados como auth.pensa.ar, pensa.ar, realm.pensa.ar, terminal.pensa.ar, etc."
