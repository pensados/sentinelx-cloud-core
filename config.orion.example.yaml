# Predefined diagnostic playbooks.
playbooks:
  nginx_debug:
    description: "Diagn\u00f3stico b\u00e1sico cuando nginx no responde o hay errores de proxy"
    steps:
      - "systemctl status nginx"
      - "nginx -t"
      - "tail /var/log/nginx/error.log"
      - "tail /var/log/nginx/access.log"
      - "ls /etc/nginx/sites-available"
  docker_debug:
    description: "Diagn\u00f3stico general de Docker y stacks"
    steps:
      - "systemctl status docker"
      - "docker ps"
      - "docker images"
      - "ls /home/carlos/docker"
  sentinelx_debug:
    description: "Diagn\u00f3stico del agente SentinelX"
    steps:
      - "systemctl status sentinelx-agent.service"
      - "journalctl -u sentinelx-agent.service"
      - "ls /home/carlos/projects/sentinelx"
      - "cat /home/carlos/projects/sentinelx/agent.py"
  sentinelx_mcp_debug:
    description: "Diagn\u00f3stico del servidor SentinelX MCP"
    steps:
      - "systemctl status sentinelx-mcp.service"
      - "journalctl -u sentinelx-mcp.service"
      - "ls /home/carlos/services/sentinelx-mcp"
      - "cat /home/carlos/services/sentinelx-mcp/app.py"
  docs_debug:
    description: "Entrada r\u00e1pida para documentaci\u00f3n, inventario y b\u00fasqueda"
    steps:
      - "pensa-docs books"
      - "pensa-docs inventory current"
      - "pensa-docs search nginx"
  systemd_debug:
    description: "Chequeo r\u00e1pido de servicios systemd y unidades instaladas"
    steps:
      - "ls /etc/systemd/system"
      - "systemctl status sentinelx-agent.service"
      - "systemctl status sentinelx-mcp.service"
      - "systemctl status nginx"
      - "systemctl status docker"
  network_debug:
    description: "Diagn\u00f3stico b\u00e1sico de red, interfaces, rutas y puertos"
    steps:
      - "ip a"
      - "ip route"
      - "ss -tuln"
      - "ping pensa.ar"
      - "dig pensa.ar"
  cloudflared_debug:
    description: "Chequeo de t\u00faneles Cloudflare"
    steps:
      - "cloudflared tunnel list"
      - "cloudflared tunnel info"
      - "systemctl status cloudflared"
  allow_command_add:
    description: "Gu\u00eda paso a paso para permitir nuevos comandos en SentinelX"
    steps:
      - "ls /home/carlos/projects/sentinelx"
      - "grep ALLOWED_COMMANDS /home/carlos/projects/sentinelx/agent.py"
      - "sed /home/carlos/projects/sentinelx/agent.py"
      - "# Editar la lista ALLOWED_COMMANDS en agent.py"
      - "# Preferir comandos base amplios antes que variantes redundantes"
      - "sudo systemctl restart sentinelx-agent.service"
      - "systemctl status sentinelx-agent.service"
  ports_debug:
    description: "Listado completo de puertos en uso y procesos asociados"
    steps:
      - "sudo pensa-ports"

# Service unit actions (systemctl wrappers).
services:
  sentinelx:
    unit: "sentinelx-agent.service"
    manager: "systemd"
    actions:
      - "status"
      - "start"
      - "stop"
      - "restart"
    description: "Agente local SentinelX"
    checks:
      status: "systemctl status sentinelx-agent.service"
      logs: "journalctl -u sentinelx-agent.service"
    risk: "medium"
  sentinelx-mcp:
    unit: "sentinelx-mcp.service"
    manager: "systemd"
    actions:
      - "status"
      - "start"
      - "stop"
      - "restart"
    description: "Servidor MCP de SentinelX"
    checks:
      status: "systemctl status sentinelx-mcp.service"
      logs: "journalctl -u sentinelx-mcp.service"
    risk: "medium"
  nginx:
    unit: "nginx"
    manager: "systemd"
    actions:
      - "status"
      - "start"
      - "stop"
      - "restart"
      - "reload"
      - "validate"
    description: "Reverse proxy Nginx"
    checks:
      status: "systemctl status nginx"
      validate: "sudo nginx -t"
      logs: "tail /var/log/nginx/error.log"
    risk: "low"
  docker:
    unit: "docker"
    manager: "systemd"
    actions:
      - "status"
      - "start"
      - "stop"
      - "restart"
    description: "Daemon de Docker"
    checks:
      status: "systemctl status docker"
      runtime: "docker ps"
    risk: "high"


# ============================================================================
# file_ops: unified r/rw filesystem path model.
#
# Gates ALL filesystem tools: read/list/search (need r) and
# edit/move/copy/delete/chmod/chown (need rw). Each entry is a
# directory PREFIX plus an `access` level (r or rw). Canonicalized
# (symlinks resolved, '..' collapsed) before the prefix check.
# Unknown/missing access degrades to r. Most-permissive match wins.
#
# Back-compat: a legacy `allowed_read_paths:` bare list is still
# accepted (each entry = access: r). If both are present, `paths:`
# wins with a deprecation warning.
#
# This is a REFERENCE example. Note rw is granted ONLY to the specific
# project subtree the assistant is expected to maintain — never to
# /etc or a broad path. Read is granted wider for diagnostics.
# ============================================================================
file_ops:
  paths:
    - path: /etc                # service configs (read for diagnostics)
      access: r
    - path: /var/log            # logs
      access: r
    - path: /opt                # installed apps
      access: r
    - path: /home/carlos/projects/sentinelx-cloud
      access: rw                # the project the assistant maintains
                                # (narrow, deliberate rw subtree)

  # max_read_bytes: 65536
  # max_list_entries: 1000
  # max_search_results: 200