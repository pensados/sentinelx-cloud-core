  - "tee"
  - "cp"
  - "mv"
  - "mkdir"
  - "sudo touch"
  - "getfacl"
  - "rm"
  - "ln -s"
  - "unlink"
  - "chmod"
  - "chown"
  - "docker"
  - "sudo docker"
  - "nginx -t"
  - "sudo nginx -t"
  - "ip a"
  - "ip route"
  - "ss -tuln"
  - "netstat -tuln"
  - "ping"
  - "traceroute"
  - "tcpdump"
  - "dig"
  - "nslookup"
  - "cloudflared tunnel list"
  - "cloudflared tunnel run"
  - "cloudflared tunnel info"
  - "pensa-docs"
  - "pensa-summary"
  - "/opt/pensa-control/bookstack/pensa-nginx-index.sh"
  - "/home/carlos/projects/sentinelx/restart_service.sh"
  - "/home/carlos/projects/sentinelx/restart_agent.sh"
  - "sudo tee"
  - "sudo cp"
  - "sudo mv"
  - "sudo mkdir"
  - "sudo rm"
  - "sudo ln -s"
