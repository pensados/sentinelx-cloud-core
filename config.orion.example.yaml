# Real config used on pensa-orion (the dev/host server).
# This file is in the repo as a REFERENCE example with rich infra.
# Each end-user installs sentinelx-cloud-core with their own /etc/sentinelx/config.yaml.

agent:
  hostname_label: pensa-orion
  description: "Main pensainfra production host"
  # Advisory MCP toolset profile this host prefers: 'compact' or 'full'.
  # Omit (or leave commented) for no preference — stock SentinelX gets the
  # full catalog. The hub applies this only as a default and only when ALL of
  # your connected agents agree; an explicit dashboard choice always wins.
  # preferred_profile: compact

# Commands the agent will execute via the `exec` op.
# Each entry is a command prefix; agent matches by .startswith().
