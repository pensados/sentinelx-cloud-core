  sentinelx_agent_file:
    path: "/home/carlos/projects/sentinelx/agent.py"
    description: "Archivo principal del agente SentinelX"
  sentinelx_mcp_project:
    path: "/home/carlos/projects/sentinelx-mcp"
    description: "Servidor MCP"
  galicia_android_project:
    path: "/home/carlos/projects/GALICIA/galicia-android"
    description: "Proyecto Android de Banco Galicia"
  buenas_frases_android_project:
