    description: "Homes de usuarios"
  home:
    path: "/home/carlos"
    description: "Directorio home principal"
  projects:
    path: "/home/carlos/projects"
    description: "Repos y proyectos varios"
  services:
    path: "/home/carlos/services"
    description: "Servicios propios (ej: sentinelx-mcp)"
  docker:
    path: "/home/carlos/docker"
    description: "Stacks dockerizados"
  pensainfra:
    path: "/home/carlos/pensainfra"
    description: "Infra principal"
  pensainfra_scripts:
    path: "/home/carlos/pensainfra/scripts"
    description: "Scripts operativos"
  sentinelx_project:
