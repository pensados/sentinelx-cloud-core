name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Smoke import
        run: python -c "import sentinelx_core; print(sentinelx_core.AGENT_VERSION)"

  # The test suite on the oldest and newest Python we see on hosts. Kept out of
  # the release job's `needs` on purpose: it has never run here before, and an
  # environment difference on the runner must not block a release. Added after a
  # 3.14-only regression (pathlib.Path.exists() stopped raising on EACCES) that
  # tests/test_unreadable_parent.py catches but nothing ran (sxrep_C3Q86CHYQ292).
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  lint:
    # Bug-focused rules, pinned version (see [tool.ruff.lint] in pyproject.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.1
          ruff check src tests

  release:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build tarball
        run: |
          # Strip dev artifacts and produce sentinelx-cloud-core-<arch>.tar.gz
          mkdir -p dist/sentinelx-cloud-core/{bin,src}
          cp -r src/sentinelx_core dist/sentinelx-cloud-core/src/
          cp pyproject.toml LICENSE README.md config.example.yaml dist/sentinelx-cloud-core/
          cp systemd/sentinelx-cloud-core.service dist/sentinelx-cloud-core/
          cd dist && tar czf sentinelx-cloud-core-x86_64.tar.gz sentinelx-cloud-core
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/sentinelx-cloud-core-*.tar.gz
