name: macos-agent

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos-agent:
    # macos-14 is retired on 2026-11-02; its jobs were already being cancelled before
    # running. A pinned label, not macos-latest, so the macOS version only changes on purpose.
    runs-on: macos-15          # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agent
        run: pip install -e .
      - name: Import check
        run: python -c "import sentinelx_core.client; import sentinelx_core.executor; print('imports OK on macOS')"
      - name: Gather machine info on macOS
        run: |
          python - <<'PY'
          import json
          from sentinelx_core.client import _gather_machine_info
          info = _gather_machine_info()
          print(json.dumps(info, indent=2))
          fields = ("cpu_model", "cpu_cores", "mem_total_bytes",
                    "disk_total_bytes", "machine_type", "distro")
          missing = [k for k in fields if info.get(k) is None]
          assert not missing, f"fields not populated on macOS: {missing}"
          assert info["machine_type"] in ("physical", "vm"), info["machine_type"]
          print("OK - machine info populated on macOS")
          PY
      - name: Core ops on macOS (exec / script_run / read / list)
        run: |
          python - <<'PY'
          import yaml, tempfile, os, asyncio
          from pathlib import Path
          from sentinelx_core.handlers import build_registry

          tmp = os.path.realpath(tempfile.mkdtemp())  # macOS: /var -> /private/var
          cfg = yaml.safe_load(open("config.example.yaml"))
          cfg.setdefault("file_ops", {})["paths"] = [{"path": tmp, "access": "rw"}]
          cfg["upload_base"] = os.path.join(tmp, "uploads")
          os.makedirs(cfg["upload_base"], exist_ok=True)
          cmds = set(cfg.get("allowed_commands") or [])
          cmds.update(["echo", "uname", "cat", "ls", "sw_vers"])
          cfg["allowed_commands"] = sorted(cmds)
          cfgpath = os.path.join(tmp, "cfg.yaml")
          open(cfgpath, "w").write(yaml.safe_dump(cfg))

          async def main():
              h = build_registry(config_path=Path(cfgpath))
              r = await h["exec"]({"command": "uname -s"})
              print("exec ->", str(r)[:160])
              assert "Darwin" in str(r), r

              r = await h["script_run"]({"content": "echo from-script-42", "interpreter": "bash"})
              print("script_run ->", str(r)[:160])
              assert "from-script-42" in str(r), r

              fpath = os.path.join(tmp, "hello.txt")
              open(fpath, "w").write("macos-file-content")
              r = await h["read"]({"path": fpath})
              print("read ->", str(r)[:160])
              assert "macos-file-content" in str(r), r

              r = await h["list"]({"path": tmp})
              print("list ->", str(r)[:160])
              assert "hello.txt" in str(r), r

              print("OK - core ops (exec, script_run, read, list) work on macOS")

          asyncio.run(main())
          PY
