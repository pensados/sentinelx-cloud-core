# ============================================================================
# AGENT PROFILE (optional) — advisory MCP toolset preference
# ============================================================================
# Advertise which MCP toolset profile this host prefers: 'compact' or 'full'.
# ADVISORY only: an explicit dashboard/connection choice always wins; the hub
# applies 'compact' only when ALL of your connected agents agree (a mix never
# collapses the connection's toolset); an invalid value is sanitized to no
# preference. Omit entirely (the default) and stock SentinelX gets the full
# catalog. Uncomment to use:
#
# agent:
#   preferred_profile: compact   # compact | full

# SentinelX Core - Windows example config (derived from config.example.yaml).
#
# SCOPE: the default Windows config. allowed_commands ship READ-ONLY
# (PowerShell-native inspection). The agent runs as a WinSW service (so it can
# self-restart), ships diagnostic playbooks, and exposes config.yaml as
# file-scoped rw so the policy self-manages. Write file ops (sentinel_edit
# write, move/copy/delete, chown via ACLs) work on Windows -- add rw paths and
# any write / bare `git` commands you want, then reload. The installer fills in
# file_ops.paths (your profile + a workspace) on a fresh install.
#
# allowed_commands: PowerShell-native, read-only. The exec op runs each
#   command via `powershell -NoProfile -NonInteractive -Command <cmd>`
#   (pwsh if present). The allowlist matches by PREFIX and is
#   case-SENSITIVE, so use canonical cmdlet casing (Get-ChildItem, not
#   get-childitem). Piping an allowlisted Get-* into Select-Object /
#   Where-Object / Format-* / ConvertTo-Json works: the whole pipeline
#   runs under the leading (allowlisted) command, so those shaping cmdlets
#   need not be listed on their own.
#   NOT listed (deliberately): powershell / pwsh / cmd themselves (listing
#   the shell would let exec run anything, defeating the allowlist), and
#   anything that writes or destroys.
# services: Windows service control (sc.exe / *-Service) lands in
#   Milestone 2, so the services map ships empty. A commented template is
#   below.
# file_ops: read-only. No `rw` paths by default -- config self-management
#   (file-scoped rw on config.yaml) and a writable workspace arrive with
#   Milestone 3. Windows has no universal read root like /etc, so pick the
#   paths you want to expose (examples commented below).

allowed_commands:

  # --- Files & directories (read) ----------------------------------------
  - Get-ChildItem
  - Get-Item
  - Get-ItemProperty
  - Get-Content
  - Select-String
  - Test-Path
  - Resolve-Path
  - Get-Location
  - Get-FileHash

  # --- Processes & services (inspect) ------------------------------------
  - Get-Process
  - Get-Service
  - Get-ScheduledTask

  # --- System & hardware info --------------------------------------------
  - Get-ComputerInfo
  - Get-CimInstance
  - Get-HotFix
  - Get-Host
  - Get-Date
  - Get-TimeZone
  - Get-Culture
  - Get-PSDrive
  - Get-Volume
  - Get-Disk
  - Get-Partition
  - Get-LocalUser
  - Get-LocalGroup

  # --- Event logs --------------------------------------------------------
  - Get-WinEvent
  - Get-EventLog

  # --- PowerShell environment (read) -------------------------------------
  - Get-Command
  - Get-Help
  - Get-Module
  - Get-Variable
  - Get-Alias
  - Get-ExecutionPolicy

  # --- Networking (read) -------------------------------------------------
  - Get-NetIPConfiguration
  - Get-NetIPAddress
  - Get-NetAdapter
  - Get-NetTCPConnection
  - Get-NetRoute
  - Get-DnsClientServerAddress
  - Resolve-DnsName
  - Test-NetConnection
  - Test-Connection

  # --- Classic Windows tools (read) --------------------------------------
  # NOTE: a few of these have write-ish subcommands the prefix match can't
  # exclude (e.g. `ipconfig /release`). Drop any you'd rather not expose.
  - systeminfo
  - hostname
  - whoami
  - tasklist
  - driverquery
  - ipconfig
  - netstat
  - nslookup
  - ping
  - tracert
  - route print
  - arp -a
  - ver
  - vol

  # --- Dev tooling -------------------------------------------------------
  # git is write-capable (push / reset / checkout) and runs as the agent's
  # account (LocalSystem). Included by default. For a tighter setup, drop it
  # or narrow to read-only prefixes: git status / git log / git diff /
  # git branch / git remote -v.
  - git

# ============================================================================
# Windows services the agent may control. `unit` is the Windows service NAME
# (what Get-Service -Name expects). The agent's own WinSW service is declared
# so it can self-restart (restart = detached WMI net stop + net start, which
# survives the agent being stopped). Add others (inspection or control) here.
# ============================================================================
services:
  sentinelx:
    unit: SentinelX
    actions: [status, restart, is-active]
    requires_sudo: false
    description: The SentinelX agent itself (WinSW service).

# ===========================================================================
# Playbooks: Windows-native diagnostic recipes. The LLM follows the step
# list; each step is a suggested read-only command. Add your own here.
# ===========================================================================
playbooks:
  windows_service_debug:
    description: Inspect Windows service health (the systemd_debug / launchd_debug equivalent).
    when: 'User asks whether a service is running, to check the agent, or reports a Windows service problem.
      Triggers: "is X running", "check the sentinelx service", "why won''t X start", "service health".'
    steps:
    - 'Running services: sentinel_exec  Get-Service | Where-Object Status -eq Running | Sort-Object Name
      . For one service: Get-Service -Name <name>  (shows Status and StartType).'
    - 'For a service declared in policy, prefer the service op: sentinel_service action=status service=<name>.
      It maps to Get-Service and returns Status + DisplayName.'
    - 'Check the agent itself: sentinel_service action=status service=sentinelx. Status = Running confirms
      health.'
    - 'Start mode + logon account + binary path: sentinel_exec  Get-CimInstance Win32_Service | Where-Object
      Name -eq <name> | Select-Object Name,State,StartMode,StartName,PathName .'
    - 'Recent SCM errors in the System log: sentinel_exec  Get-WinEvent -FilterHashtable @{LogName="System";ProviderName="Service
      Control Manager"} -MaxEvents 20 | Select-Object TimeCreated,Id,LevelDisplayName,Message .'
    requires:
    - Get-Service, Get-CimInstance, Get-WinEvent in the allowlist (default Windows config).
    notes:
    - 'Windows has no systemctl/launchctl: services are managed by the SCM. Get-Service inspects; Start/Stop/Restart-Service
      need admin.'
    - 'The agent runs as a WinSW service named SentinelX (service key "sentinelx"). Restarting it is a
      self-restart: the WS session drops (read_loop_ended) and the agent reconnects on its own -- a detached
      WMI helper does the stop+start.'
    - 'Agent logs are in C:\ProgramData\SentinelX\logs\ : sentinelx-service.err.log (stderr), .out.log
      (stdout), .wrapper.log (WinSW).'
  update_sentinelx_code:
    description: Update the SentinelX agent on this Windows host to the latest commit on main. Handles AGENT
      CODE only.
    when: User asks to update / upgrade / pull the latest agent (e.g. "update sentinelx", "is there a new
      version?", "pull the latest").
    steps:
    - 'Note the current version: call sentinel_capabilities and read the ''version'' field.'
    - 'Reinstall from git into the venv (Windows installs the agent as a pip package, NOT a git checkout):
      run in a powershell script_run: C:\ProgramData\SentinelX\.venv\Scripts\python.exe -m pip install --upgrade
      --force-reinstall "sentinelx-cloud-core @ git+https://github.com/pensados/sentinelx-cloud-core.git@main".
      This also pulls the pinned sentinelx-cloud-protocol. git must be on PATH so pip can fetch the git
      dependencies.'
    - 'Load the new code with a self-restart: sentinel_service action=restart service=sentinelx. A detached
      WMI helper does the stop+start of the WinSW service; the WS session drops (read_loop_ended) and the
      agent reconnects on its own. Wait a few seconds, then continue.'
    - Verify with sentinel_capabilities that the agent responds and the version reflects the update. If
      capabilities errors out, the new build may have a startup bug - check C:\ProgramData\SentinelX\logs\sentinelx-service.err.log.
    - (Optional) Mention that config.example.windows.yaml may ship new playbooks/services/commands not yet
      in C:\ProgramData\SentinelX\config.yaml; adopting them is a separate, manual step (there is no auto-merge).
    requires:
    - git on PATH (pip fetches sentinelx-cloud-core and sentinelx-cloud-protocol from GitHub over git+https).
    - The venv at C:\ProgramData\SentinelX\.venv and outbound network to github.com.
    - '''sentinelx'' declared in services (default Windows config) for the self-restart.'
    notes:
    - Unlike the Linux install (a git checkout under /opt), Windows installs the agent as a pip package
      inside C:\ProgramData\SentinelX\.venv. There is no local git repo to 'git pull' - reinstalling with
      --force-reinstall from git is the update path (mirrors the macOS uv approach).
    - The reinstall updates files on disk but does NOT restart the running agent by itself; the explicit
      sentinel_service restart is what loads the new code into memory.
    - The service runs via WinSW (service key 'sentinelx', label SentinelX). Restarting it needs no admin
      - requires_sudo is false because a detached helper performs the stop+start.
    - Updates are user-driven - there is intentionally no auto-update.
  network_debug:
    description: Windows network diagnostics - interfaces, routes, listening ports, DNS, reachability.
    when: 'User reports network issues or asks what is listening on a port. Triggers: "internet not working",
      "can''t reach X", "what''s on port Y", "check DNS".'
    steps:
    - 'Interfaces + IPs: sentinel_exec Get-NetIPConfiguration  (or  Get-NetIPAddress | Where-Object AddressFamily
      -eq IPv4 ). Classic: ipconfig /all.'
    - 'Routing table / default gateway: sentinel_exec  Get-NetRoute -AddressFamily IPv4 | Sort-Object
      RouteMetric . The 0.0.0.0/0 destination is the default route.'
    - 'Listening ports with owning process: sentinel_exec  Get-NetTCPConnection -State Listen | Select-Object
      LocalAddress,LocalPort,OwningProcess | Sort-Object LocalPort . Map a PID: Get-Process -Id <pid>.'
    - 'DNS servers: sentinel_exec  Get-DnsClientServerAddress -AddressFamily IPv4 . Resolve a name: Resolve-DnsName
      <domain>.'
    - 'Reachability (DNS + ping + TCP + route in one call): sentinel_exec  Test-NetConnection <host> -Port
      <port> . Plain ping: Test-Connection <host> -Count 3.'
    requires:
    - Get-NetIPConfiguration, Get-NetRoute, Get-NetTCPConnection, Get-DnsClientServerAddress, Resolve-DnsName,
      Test-NetConnection in the allowlist (default Windows config).
    notes:
    - 'Prefer the Get-Net* cmdlets over the classic tools: they return objects you can filter and format.
      netstat -ano still works for a raw view.'
    - 'Test-NetConnection is the Windows swiss-army probe: DNS + ICMP ping + TCP-connect + route, all
      in one.'
  system_debug:
    description: Windows system health - OS/build, uptime, memory, disks, top processes, recent errors.
    when: 'User asks about overall system health, resource usage, uptime, or disk space. Triggers: "is
      the box healthy", "what''s using memory/CPU", "how much disk is left", "how long has it been up".'
    steps:
    - 'OS + build + uptime: sentinel_exec  Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,LastBootUpTime
      .'
    - 'Memory (GB): sentinel_exec  Get-CimInstance Win32_OperatingSystem | Select-Object @{n="TotalGB";e={[math]::Round($_.TotalVisibleMemorySize/1MB,1)}},@{n="FreeGB";e={[math]::Round($_.FreePhysicalMemory/1MB,1)}}
      .'
    - 'Top processes by memory: sentinel_exec  Get-Process | Sort-Object WS -Descending | Select-Object
      -First 10 Name,Id,@{n="Mem_MB";e={[math]::Round($_.WS/1MB)}},CPU .'
    - 'Disks / free space: sentinel_exec  Get-Volume | Where-Object DriveLetter | Select-Object DriveLetter,FileSystemLabel,@{n="SizeGB";e={[math]::Round($_.Size/1GB,1)}},@{n="FreeGB";e={[math]::Round($_.SizeRemaining/1GB,1)}}
      .'
    - 'Recent Critical/Error events: sentinel_exec  Get-WinEvent -FilterHashtable @{LogName="System";Level=1,2}
      -MaxEvents 20 | Select-Object TimeCreated,Id,ProviderName,Message . (Level 1=Critical, 2=Error.)'
    requires:
    - Get-CimInstance, Get-Process, Get-Volume, Get-WinEvent in the allowlist (default Windows config).
    notes:
    - CIM/WMI (Get-CimInstance) is the richest source for OS + hardware facts. systeminfo gives a text
      dump if you prefer.
    - WS (working set) is a process's resident memory; CPU is total CPU-seconds since it started.


log:
  # On Windows the foreground agent logs to stderr; a service install
  # (Milestone 2) will point this at a real file, e.g.
  #   C:\ProgramData\SentinelX\logs\core.log
  level: INFO

# ============================================================================
# SSRF defense for file_url uploads (same trusted hosts as other platforms).
# ============================================================================
security:
  trusted_fetch_hosts:
    - drop.pensa.ar
    - get.sentinelx.app
  file_url_timeout_seconds: 15

# ============================================================================
# file_ops: READ-ONLY on Windows for Milestone 1.
#
# Paths use Windows form (drive letter + backslashes); they are matched
# after canonicalization, which handles case-insensitivity and mixed
# separators (verified on Windows 11). No `rw` entries yet -- writable
# workspace + file-scoped rw on config.yaml arrive with Milestone 3.
#
# Windows has no universal read root, so choose what to expose. Examples
# (uncomment / adjust to your machine; the future installer will fill in
# the profile path):
#
#   paths:
#     - path: 'C:\Users\<you>'
#       access: r
#     - path: 'C:\ProgramData'
#       access: r
#     - path: 'C:\inetpub\logs'      # IIS logs, if present
#       access: r
# ============================================================================
file_ops:
  paths: []

# Where the agent stages script_run / upload workdirs. On Windows the
# cross-platform default resolves oddly (C:\home\sentinelx\uploads); pin it
# somewhere user-writable instead:
upload_base: 'C:\Users\Public\sentinelx-uploads'
